name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # 1. Install dependencies and compile once
  # ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile all packages
        run: npx lerna run compile

      - name: Cache workspace
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: workspace-${{ github.sha }}

  # ──────────────────────────────────────────
  # 2. Formatting check
  # ──────────────────────────────────────────
  format:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: workspace-${{ github.sha }}

      - name: Check formatting
        run: npx prettier --check "packages/*/src/**/*.{ts,tsx,json,md}"

  # ──────────────────────────────────────────
  # 3. Lint all packages
  # ──────────────────────────────────────────
  lint:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - ejson
          - nova
          - smart
          - mongo-bundle
          - apollo-bundle
          - apollo-security-bundle
          - graphql-bundle
          - http-bundle
          - email-bundle
          - logger-bundle
          - mikroorm-bundle
          - password-bundle
          - security-bundle
          - security-mongo-bundle
          - validator-bundle
          - terminal-bundle
          - rabbitmq-bundle
          - ui-apollo-bundle
          - x
          - x-bundle
          - x-auth-bundle
          - x-cron-bundle
          - x-password-bundle
          - x-s3-bundle
          - x-ui
          - x-ui-admin
          - x-ui-collections-bundle
          - x-ui-guardian-bundle
          - x-ui-i18n-bundle
          - x-ui-next
          - x-ui-react-bundle
          - x-ui-react-router-bundle
          - x-ui-router
          - x-ui-session-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: workspace-${{ github.sha }}

      - name: Lint ${{ matrix.package }}
        run: cd packages/${{ matrix.package }} && npm run lint

  # ──────────────────────────────────────────
  # 4. Unit tests (no external services)
  # ──────────────────────────────────────────
  test-unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - ejson
          - smart
          - apollo-bundle
          - apollo-security-bundle
          - graphql-bundle
          - http-bundle
          - email-bundle
          - logger-bundle
          - password-bundle
          - security-bundle
          - validator-bundle
          - terminal-bundle
          - ui-apollo-bundle
          - x
          - x-password-bundle
          - x-ui
          - x-ui-admin
          - x-ui-collections-bundle
          - x-ui-guardian-bundle
          - x-ui-i18n-bundle
          - x-ui-next
          - x-ui-react-bundle
          - x-ui-react-router-bundle
          - x-ui-router
          - x-ui-session-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: workspace-${{ github.sha }}

      - name: Test ${{ matrix.package }}
        run: cd packages/${{ matrix.package }} && npm test

  # ──────────────────────────────────────────
  # 5. Integration tests (MongoDB required)
  # ──────────────────────────────────────────
  test-mongo:
    needs: build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        package:
          - mongo-bundle
          - mikroorm-bundle
          - nova
          - security-mongo-bundle
          - x-bundle
          - x-auth-bundle
          - x-cron-bundle
          - x-s3-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: workspace-${{ github.sha }}

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 10); do
            if mongosh --eval "db.runCommand({ ping: 1 })" --quiet 2>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/10)"
            sleep 2
          done

      - name: Test ${{ matrix.package }}
        run: cd packages/${{ matrix.package }} && npm test

  # ──────────────────────────────────────────
  # 6. Integration tests (RabbitMQ required)
  # ──────────────────────────────────────────
  test-rabbitmq:
    needs: build
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/dist
          key: workspace-${{ github.sha }}

      - name: Wait for RabbitMQ
        run: |
          for i in $(seq 1 15); do
            if curl -s http://localhost:15672 > /dev/null 2>&1; then
              echo "RabbitMQ is ready"
              break
            fi
            echo "Waiting for RabbitMQ... ($i/15)"
            sleep 2
          done

      - name: Test rabbitmq-bundle
        run: cd packages/rabbitmq-bundle && npm test
