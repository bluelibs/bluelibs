version: 2
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "theodor-diaconu"
    assignees:
      - "theodor-diaconu"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # --- Packages ---

  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    reviewers: ["theodor-diaconu"]
    commit-message: { prefix: "deps", include: "scope" }
    labels: ["dependencies"]
    groups:
      all: { patterns: ["*"] }

